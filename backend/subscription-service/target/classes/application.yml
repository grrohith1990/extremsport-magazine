spring:
  application:
    name: subscription-service

  datasource:
    url: jdbc:postgresql://localhost:5435/subscription_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/extremsport}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8080/realms/extremsport/protocol/openid-connect/certs}

server:
  port: 8084

# Legacy billing system connection
billing:
  system:
    url: ${BILLING_SYSTEM_URL:http://localhost:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.extremsport: DEBUG

