spring:
  application:
    name: user-service

  datasource:
    url: jdbc:h2:mem:user_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/extremsport

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

server:
  port: 8082

auth:
  server:
    url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.extremsport: DEBUG

